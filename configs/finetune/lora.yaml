base_model: Qwen/Qwen2.5-7B-Instruct
output_dir: models/qwen-campus-lora
dataset_path: data/datasets/sft.jsonl

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  epochs: 3
  learning_rate: 0.0002
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  max_seq_length: 4096
  warmup_ratio: 0.03

